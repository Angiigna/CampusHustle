{% extends 'base.html' %}

{% block title %}Sign In - Papido Campus Rides{% endblock %}

{% block content %}
<div class="py-6 space-y-6">
    <div class="text-center space-y-3">
        <div class="flex justify-center">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Papido" class="h-16 w-auto object-contain drop-shadow-[0_4px_16px_rgba(245,158,11,0.5)]">
        </div>
        <div>
            <h1 class="font-heading font-black text-3xl text-white tracking-tight">Papido Campus Mobility</h1>
            <p class="text-slate-400 text-sm font-medium">Fast, reliable, and affordable bike-taxis across campus.</p>
        </div>
    </div>

    <!-- Account Sign In Form -->
    <div class="bg-slate-900/80 border border-amber-500/20 rounded-2xl p-5 shadow-2xl space-y-4 backdrop-blur-sm">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Account Sign In</h2>
        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-sm">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required placeholder="student@campus.edu" class="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-9 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2 text-sm">
                <span>Sign In to Papido</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="pt-3 border-t border-slate-800/80 space-y-2">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block text-center">New to Papido?</span>
            <div class="grid grid-cols-2 gap-2">
                <a href="{{ url_for('auth.register_customer') }}" class="py-2.5 px-3 bg-slate-800/90 hover:bg-slate-800 text-amber-400 font-bold rounded-xl text-xs text-center border border-amber-500/30 hover:border-amber-500 transition-colors">
                    <i class="fa-solid fa-user-plus mr-1"></i> Student Sign Up
                </a>
                <a href="{{ url_for('auth.register_rider') }}" class="py-2.5 px-3 bg-slate-800/90 hover:bg-slate-800 text-slate-200 font-bold rounded-xl text-xs text-center border border-slate-700 hover:border-slate-500 transition-colors">
                    <i class="fa-solid fa-motorcycle text-amber-500 mr-1"></i> Apply as Rider
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
