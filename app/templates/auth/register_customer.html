{% extends 'base.html' %}

{% block title %}Student Sign Up - Papido{% endblock %}

{% block content %}
<div class="py-4 space-y-5">
    <div class="text-center space-y-1">
        <h1 class="font-heading font-extrabold text-2xl text-white">Create Student Account</h1>
        <p class="text-slate-400 text-xs font-medium">Get instant bike-taxis anywhere on campus with Papido.</p>
    </div>

    <div class="bg-slate-900/80 border border-amber-500/20 rounded-2xl p-5 shadow-xl space-y-4 backdrop-blur-sm">
        <form action="{{ url_for('auth.register_customer') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="e.g. Priya Sharma" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Campus Email Address</label>
                <input type="email" name="email" required placeholder="student@campus.edu" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Phone Number</label>
                <input type="tel" name="phone" required placeholder="9876543210" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black rounded-xl text-sm shadow-lg shadow-amber-500/20 transition-all">
                Create Student Account
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800">
            <span class="text-xs text-slate-400">Already have a Papido account? </span>
            <a href="{{ url_for('auth.login') }}" class="text-xs font-bold text-amber-400 hover:underline">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
